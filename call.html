<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CSIR NET • Video/Audio Call</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #0A1628;
            --surface: #112240;
            --accent: #38BDF8;
            --green: #10B981;
            --red: #EF4444;
            --orange: #F59E0B;
            --gold: #DAA520;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg); color: #fff; height: 100dvh;
            display: flex; flex-direction: column; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }
        .header {
            background: var(--surface); padding: 12px 16px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 2px solid var(--accent); flex-shrink: 0; z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .back-btn {
            width: 34px; height: 34px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.1); color: #fff; cursor: pointer;
            font-size: 0.9rem; display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.2); }
        .header h2 { font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .status-dot {
            width: 9px; height: 9px; border-radius: 50%; background: #94A3B8;
            display: inline-block; transition: 0.3s;
        }
        .status-dot.connected { background: var(--green); box-shadow: 0 0 10px var(--green); }
        .status-dot.calling { background: var(--orange); animation: blink 0.8s infinite; }
        .status-dot.logged-in { background: var(--accent); }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .call-timer {
            font-family: 'Courier New', monospace; font-size: 0.8rem; font-weight: 700;
            background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 14px; letter-spacing: 1px;
        }
        .call-timer.hidden { display: none; }
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .loading-screen { display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .loading-screen.hidden { display: none; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2);
            border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .home-screen { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px; text-align: center; }
        .home-screen.hidden { display: none; }
        .user-card {
            background: var(--surface); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px; padding: 20px; width: 100%; max-width: 300px;
        }
        .my-avatar {
            width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, var(--orange), var(--gold));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; margin: 0 auto 10px;
        }
        .my-name { font-size: 1rem; font-weight: 700; }
        .my-email { font-size: 0.6rem; color: #94A3B8; margin-top: 2px; }
        .partner-section { margin-top: 8px; width: 100%; max-width: 300px; }
        .partner-label { font-size: 0.6rem; color: #94A3B8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .partner-chip {
            background: var(--surface); border: 2px solid rgba(255,255,255,0.15);
            padding: 14px 16px; border-radius: 14px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 12px;
        }
        .partner-chip:hover { border-color: var(--accent); background: rgba(56,189,248,0.08); }
        .partner-chip.selected { border-color: var(--green); background: rgba(16,185,129,0.1); box-shadow: 0 0 15px rgba(16,185,129,0.2); }
        .partner-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, #3B82F6, #6366F1);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; flex-shrink: 0;
        }
        .partner-info { text-align: left; flex: 1; }
        .partner-name { font-weight: 600; font-size: 0.78rem; }
        .partner-email { font-size: 0.52rem; color: #94A3B8; }
        .call-buttons { display: flex; gap: 16px; margin-top: 12px; }
        .call-btn {
            width: 64px; height: 64px; border-radius: 50%; border: none;
            cursor: pointer; font-size: 1.6rem; display: flex; align-items: center;
            justify-content: center; transition: 0.2s; color: #fff;
        }
        .call-btn:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
        .call-btn:not(:disabled):hover { transform: scale(1.12); }
        .call-btn.video-btn { background: linear-gradient(135deg, #059669, #10B981); box-shadow: 0 6px 20px rgba(16,185,129,0.3); }
        .call-btn.audio-btn { background: linear-gradient(135deg, #2563EB, #3B82F6); box-shadow: 0 6px 20px rgba(59,130,246,0.3); }
        .call-btn-label { font-size: 0.52rem; color: #94A3B8; margin-top: 4px; }
        .video-container { width: 100%; height: 100%; position: relative; display: none; background: #000; }
        .video-container.active { display: block; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo {
            position: absolute; bottom: 80px; right: 14px; width: 115px; height: 155px;
            border-radius: 12px; object-fit: cover; border: 3px solid rgba(255,255,255,0.5);
            background: #1a1a2e; z-index: 10; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }
        .audio-screen { display: none; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 30px; }
        .audio-screen.active { display: flex; }
        .audio-avatar {
            width: 100px; height: 100px; border-radius: 50%;
            background: linear-gradient(135deg, #E87722, #F59E0B);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.8rem; animation: soft-pulse 2s infinite;
        }
        @keyframes soft-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(232,119,34,0.5); } 50% { box-shadow: 0 0 0 22px rgba(232,119,34,0); } }
        .audio-name { font-size: 1rem; font-weight: 600; }
        .audio-status { font-size: 0.65rem; color: #94A3B8; }
        .incoming-screen { display: none; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 30px; }
        .incoming-screen.active { display: flex; }
        .incoming-avatar {
            width: 90px; height: 90px; border-radius: 50%;
            background: linear-gradient(135deg, #E87722, #F59E0B);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; animation: ring-shake 0.5s infinite;
        }
        @keyframes ring-shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(10deg); } 75% { transform: rotate(-10deg); } }
        .incoming-name { font-size: 1rem; font-weight: 600; }
        .incoming-type { font-size: 0.65rem; color: #94A3B8; }
        .incoming-btns { display: flex; gap: 24px; margin-top: 10px; }
        .accept-btn, .decline-btn {
            width: 60px; height: 60px; border-radius: 50%; border: none;
            cursor: pointer; font-size: 1.5rem; display: flex; align-items: center;
            justify-content: center; transition: 0.2s; color: #fff;
        }
        .accept-btn { background: var(--green); box-shadow: 0 6px 20px rgba(16,185,129,0.4); }
        .decline-btn { background: var(--red); box-shadow: 0 6px 20px rgba(239,68,68,0.4); }
        .accept-btn:hover, .decline-btn:hover { transform: scale(1.15); }
        .controls {
            background: rgba(0,0,0,0.65); backdrop-filter: blur(15px);
            padding: 14px 16px; display: none; align-items: center;
            justify-content: center; gap: 16px; flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.1); z-index: 10;
        }
        .controls.active { display: flex; }
        .ctrl-btn {
            width: 46px; height: 46px; border-radius: 50%; border: none;
            cursor: pointer; font-size: 1.1rem; display: flex; align-items: center;
            justify-content: center; transition: 0.2s; color: #fff; background: rgba(255,255,255,0.12);
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }
        .ctrl-btn.end-call { background: var(--red); width: 52px; height: 52px; font-size: 1.3rem; }
        .ctrl-btn.end-call:hover { background: #DC2626; box-shadow: 0 0 22px rgba(239,68,68,0.6); }
        .ctrl-btn.off { background: var(--red); }
        .ctrl-btn.hidden { display: none; }
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120px);
            background: #1B3A5C; color: #fff; padding: 9px 18px; border-radius: 20px;
            font-size: 0.68rem; font-weight: 600; z-index: 999;
            transition: 0.35s cubic-bezier(0.4,0,0.2,1); white-space: nowrap;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .error-text { color: var(--red); font-size: 0.6rem; text-align: center; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <div class="header">
        <div class="header-left">
            <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i></button>
            <h2><span class="status-dot" id="statusDot"></span> <span id="headerTitle">CSIR NET Call</span></h2>
        </div>
        <div class="call-timer hidden" id="callTimerDisplay">00:00</div>
    </div>

    <div class="main-content" id="mainContent">
        <div class="loading-screen" id="loadingScreen">
            <div class="spinner"></div>
            <p style="font-size:0.75rem;color:#94A3B8;">Connecting...</p>
        </div>

        <div class="home-screen hidden" id="homeScreen">
            <div class="user-card">
                <div class="my-avatar">👤</div>
                <div class="my-name" id="myName">Loading...</div>
                <div class="my-email" id="myEmail">...</div>
            </div>
            <div class="partner-section">
                <div class="partner-label">📞 Call Partner</div>
                <div class="partner-chip" id="partnerChip" onclick="selectPartner()">
                    <div class="partner-avatar">👤</div>
                    <div class="partner-info">
                        <div class="partner-name" id="partnerName">Loading...</div>
                        <div class="partner-email" id="partnerEmail">...</div>
                    </div>
                    <i class="fas fa-check-circle" id="selectedCheck" style="color:var(--green);display:none;"></i>
                </div>
            </div>
            <div class="call-buttons">
                <div style="text-align:center;">
                    <button class="call-btn video-btn" id="videoCallBtn" onclick="startCall(true)" disabled>
                        <i class="fas fa-video"></i>
                    </button>
                    <div class="call-btn-label">Video Call</div>
                </div>
                <div style="text-align:center;">
                    <button class="call-btn audio-btn" id="audioCallBtn" onclick="startCall(false)" disabled>
                        <i class="fas fa-phone"></i>
                    </button>
                    <div class="call-btn-label">Audio Call</div>
                </div>
            </div>
            <p class="error-text hidden" id="selectError">⚠️ Select partner first</p>
        </div>

        <div class="incoming-screen hidden" id="incomingScreen">
            <div class="incoming-avatar">📞</div>
            <div class="incoming-name" id="incomingCallerName">Incoming Call</div>
            <div class="incoming-type" id="incomingCallType">Video Call</div>
            <div class="incoming-btns">
                <button class="decline-btn" onclick="declineCall()"><i class="fas fa-phone-slash"></i></button>
                <button class="accept-btn" onclick="acceptCall()"><i class="fas fa-phone"></i></button>
            </div>
        </div>

        <div class="video-container hidden" id="videoContainer">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <div class="audio-screen hidden" id="audioScreen">
            <div class="audio-avatar">🎙️</div>
            <div class="audio-name" id="audioPartnerName">Connected</div>
            <div class="audio-status">Audio Call Active</div>
        </div>
    </div>

    <div class="controls hidden" id="controls">
        <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()"><i class="fas fa-microphone"></i></button>
        <button class="ctrl-btn hidden" id="videoToggleBtn" onclick="toggleVideo()"><i class="fas fa-video"></i></button>
        <button class="ctrl-btn end-call" onclick="hangUp()"><i class="fas fa-phone-slash"></i></button>
        <button class="ctrl-btn" onclick="toggleSpeaker()"><i class="fas fa-volume-up"></i></button>
        <button class="ctrl-btn hidden" id="switchCameraBtn" onclick="switchCamera()"><i class="fas fa-sync-alt"></i></button>
    </div>

    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyDS0rzCKglHblF2dlFEKE-ouV0yOu0z5UM",
            authDomain: "mine-a1e68.firebaseapp.com",
            projectId: "mine-a1e68",
            storageBucket: "mine-a1e68.appspot.com",
            messagingSenderId: "48499757892",
            appId: "1:48499757892:web:d0fd281ab0df945e893d11"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ==================== USER CONFIG ====================
        const USERS = {
            'user1': { email: 'mgbhaukali@gmail.com', name: 'Mg Bhaukali', id: 'user1' },
            'user2': { email: 'manshi@gmail.com', name: 'Manshi', id: 'user2' }
        };

        // ⚠️ CHANGE THIS: 'user1' for Mg Bhaukali, 'user2' for Manshi
        const MY_ID = 'user1';
        const PASSWORD = 'mohit123';

        const myInfo = USERS[MY_ID];
        const partnerInfo = MY_ID === 'user1' ? USERS['user2'] : USERS['user1'];

        // ==================== STATE ====================
        let isPartnerSelected = false;
        let isVideoCall = false;
        let localStream = null;
        let peerConnection = null;
        let callDoc = null;
        let callTimerInterval = null;
        let callSeconds = 0;
        let isMuted = false;
        let isVideoOff = false;
        let callDocUnsubscribe = null;
        let incomingCallUnsubscribe = null;
        let currentCallStatus = 'idle';
        let isLoggedIn = false;

        const $ = (id) => document.getElementById(id);

        // ==================== TOAST ====================
        function showToast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._t);
            t._t = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ==================== UI HELPERS ====================
        function showScreen(id) {
            ['homeScreen','incomingScreen','videoContainer','audioScreen','loadingScreen'].forEach(s => {
                const el = $(s);
                if (el) {
                    el.classList.add('hidden');
                    if (s === 'videoContainer' || s === 'audioScreen') el.classList.remove('active');
                }
            });
            const target = $(id);
            if (target) {
                target.classList.remove('hidden');
                if (id === 'videoContainer') target.classList.add('active');
                if (id === 'audioScreen') target.classList.add('active');
            }
        }

        function setStatusDot(state) {
            const dot = $('statusDot');
            dot.classList.remove('connected','calling','logged-in');
            if (state) dot.classList.add(state);
        }

        function updateTimer() {
            const m = Math.floor(callSeconds / 60);
            const s = callSeconds % 60;
            $('callTimerDisplay').textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        function startTimer() {
            stopTimer();
            callSeconds = 0;
            $('callTimerDisplay').classList.remove('hidden');
            updateTimer();
            callTimerInterval = setInterval(() => { callSeconds++; updateTimer(); }, 1000);
        }

        function stopTimer() {
            if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
            callSeconds = 0;
            $('callTimerDisplay').classList.add('hidden');
        }

        function resetCallUI() {
            stopTimer();
            $('controls').classList.remove('active');
            $('videoToggleBtn').classList.add('hidden');
            $('switchCameraBtn').classList.add('hidden');
            const mb = $('muteBtn'); if (mb) { mb.classList.remove('off'); mb.innerHTML = '<i class="fas fa-microphone"></i>'; }
            const vb = $('videoToggleBtn'); if (vb) { vb.classList.remove('off'); vb.innerHTML = '<i class="fas fa-video"></i>'; }
            const lv = $('localVideo'); if (lv) lv.srcObject = null;
            const rv = $('remoteVideo'); if (rv) rv.srcObject = null;
            $('videoContainer').classList.add('hidden'); $('videoContainer').classList.remove('active');
            $('audioScreen').classList.add('hidden'); $('audioScreen').classList.remove('active');
            $('incomingScreen').classList.add('hidden'); $('incomingScreen').classList.remove('active');
            setStatusDot('logged-in');
            currentCallStatus = 'idle';
            updateCallButtons();
            isMuted = false; isVideoOff = false;
        }

        function goHome() {
            if (currentCallStatus !== 'idle') hangUp();
            resetCallUI();
            if (isLoggedIn) { showScreen('homeScreen'); $('headerTitle').textContent = 'CSIR NET Call'; }
        }

        function updateCallButtons() {
            const vBtn = $('videoCallBtn'), aBtn = $('audioCallBtn'), err = $('selectError');
            if (isPartnerSelected && currentCallStatus === 'idle') {
                vBtn.disabled = false; aBtn.disabled = false;
                vBtn.style.opacity = '1'; aBtn.style.opacity = '1';
                err.classList.add('hidden');
            } else {
                vBtn.disabled = true; aBtn.disabled = true;
                vBtn.style.opacity = '0.3'; aBtn.style.opacity = '0.3';
            }
        }

        function selectPartner() {
            if (currentCallStatus !== 'idle') return;
            isPartnerSelected = !isPartnerSelected;
            const chip = $('partnerChip'), check = $('selectedCheck');
            if (isPartnerSelected) { chip.classList.add('selected'); check.style.display = 'inline-block'; }
            else { chip.classList.remove('selected'); check.style.display = 'none'; }
            updateCallButtons();
        }

        // ==================== AUTH ====================
        async function autoLogin() {
            showScreen('loadingScreen');
            $('headerTitle').textContent = 'Connecting...';
            try {
                try {
                    await auth.signInWithEmailAndPassword(myInfo.email, PASSWORD);
                    console.log('✅ Logged in');
                } catch (e) {
                    if (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential' || e.code === 'auth/invalid-login-credentials') {
                        await auth.createUserWithEmailAndPassword(myInfo.email, PASSWORD);
                        console.log('✅ Registered & logged in');
                    } else { throw e; }
                }
            } catch (e) {
                console.error('Auth error:', e);
                showToast('❌ Login failed');
                $('loadingScreen').classList.add('hidden');
            }
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                isLoggedIn = true;
                $('myName').textContent = myInfo.name;
                $('myEmail').textContent = myInfo.email;
                $('partnerName').textContent = partnerInfo.name;
                $('partnerEmail').textContent = partnerInfo.email;
                $('headerTitle').textContent = 'CSIR NET Call';
                setStatusDot('logged-in');
                showScreen('homeScreen');
                startListeningForCalls();
                setTimeout(() => { if (isLoggedIn && !isPartnerSelected) selectPartner(); }, 800);
            } else {
                isLoggedIn = false;
                showScreen('loadingScreen');
                stopListeningForCalls();
            }
        });

        // ==================== CALL START ====================
        async function startCall(video) {
            if (!isPartnerSelected) { $('selectError').classList.remove('hidden'); return; }
            if (currentCallStatus !== 'idle' || !isLoggedIn) return;

            isVideoCall = video;
            currentCallStatus = 'calling';
            setStatusDot('calling');
            $('headerTitle').textContent = video ? '📹 Calling...' : '📞 Calling...';
            $('selectError').classList.add('hidden');
            updateCallButtons();
            showToast(video ? '📹 Calling...' : '📞 Calling...');

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video, audio: true });

                if (video) {
                    showScreen('videoContainer');
                    $('localVideo').srcObject = localStream;
                    $('videoToggleBtn').classList.remove('hidden');
                    $('switchCameraBtn').classList.remove('hidden');
                } else {
                    showScreen('audioScreen');
                    $('audioPartnerName').textContent = partnerInfo.name;
                    $('videoToggleBtn').classList.add('hidden');
                    $('switchCameraBtn').classList.add('hidden');
                }

                $('controls').classList.add('active');
                $('homeScreen').classList.add('hidden');

                peerConnection = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }]
                });

                localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
                peerConnection.ontrack = (e) => { if (isVideoCall) $('remoteVideo').srcObject = e.streams[0]; };

                callDoc = db.collection('calls').doc();
                const offerCands = callDoc.collection('offerCandidates');
                const answerCands = callDoc.collection('answerCandidates');

                peerConnection.onicecandidate = (e) => { if (e.candidate) offerCands.add(e.candidate.toJSON()); };

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                await callDoc.set({
                    offer: { type: offer.type, sdp: offer.sdp },
                    caller: myInfo.email, callerId: MY_ID,
                    callee: partnerInfo.email, calleeId: partnerInfo.id,
                    isVideo: video, status: 'ringing',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                callDocUnsubscribe = callDoc.onSnapshot(async (snap) => {
                    const data = snap.data();
                    if (!data) return;
                    if (data.status === 'rejected') { showToast('❌ Rejected'); hangUp(); }
                    else if (data.status === 'ended') { showToast('📴 Ended'); hangUp(); }
                    else if (data.answer && !peerConnection.currentRemoteDescription) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                        setStatusDot('connected');
                        $('headerTitle').textContent = video ? '📹 Connected' : '📞 Connected';
                        startTimer(); currentCallStatus = 'connected';
                    }
                });

                answerCands.onSnapshot((snap) => {
                    snap.docChanges().forEach(ch => {
                        if (ch.type === 'added') peerConnection.addIceCandidate(new RTCIceCandidate(ch.doc.data())).catch(() => {});
                    });
                });

                peerConnection.onconnectionstatechange = () => {
                    if (peerConnection.connectionState === 'connected') {
                        setStatusDot('connected');
                        $('headerTitle').textContent = video ? '📹 Connected' : '📞 Connected';
                        startTimer(); currentCallStatus = 'connected';
                    } else if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
                        hangUp();
                    }
                };

            } catch (e) { console.error(e); showToast('❌ ' + e.message); hangUp(); }
        }

        // ==================== INCOMING ====================
        function startListeningForCalls() {
            stopListeningForCalls();
            incomingCallUnsubscribe = db.collection('calls')
                .where('calleeId', '==', MY_ID).where('status', '==', 'ringing')
                .onSnapshot((snap) => {
                    snap.docChanges().forEach(ch => {
                        if (ch.type === 'added') showIncomingCall(ch.doc.data(), ch.doc);
                        if (ch.type === 'modified') {
                            const data = ch.doc.data();
                            if (data.status === 'ended' || data.status === 'rejected') {
                                $('incomingScreen').classList.add('hidden');
                                if (currentCallStatus === 'ringing') { resetCallUI(); showScreen('homeScreen'); }
                            }
                        }
                    });
                });
        }

        function stopListeningForCalls() {
            if (incomingCallUnsubscribe) { incomingCallUnsubscribe(); incomingCallUnsubscribe = null; }
        }

        function showIncomingCall(data, doc) {
            callDoc = doc; isVideoCall = data.isVideo;
            currentCallStatus = 'ringing';
            setStatusDot('calling');
            $('headerTitle').textContent = '📞 Incoming...';
            updateCallButtons();
            $('incomingCallerName').textContent = USERS[data.callerId]?.name || data.caller;
            $('incomingCallType').textContent = data.isVideo ? '📹 Video Call' : '📞 Audio Call';
            showScreen('incomingScreen');
            $('homeScreen').classList.add('hidden');
            $('controls').classList.remove('active');
            clearTimeout(window._autoDecline);
            window._autoDecline = setTimeout(() => { if (currentCallStatus === 'ringing') declineCall(); }, 45000);
        }

        async function acceptCall() {
            clearTimeout(window._autoDecline);
            $('incomingScreen').classList.add('hidden');
            currentCallStatus = 'connecting';
            setStatusDot('calling');
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: isVideoCall, audio: true });
                if (isVideoCall) {
                    showScreen('videoContainer'); $('localVideo').srcObject = localStream;
                    $('videoToggleBtn').classList.remove('hidden'); $('switchCameraBtn').classList.remove('hidden');
                } else {
                    showScreen('audioScreen'); $('audioPartnerName').textContent = partnerInfo.name;
                    $('videoToggleBtn').classList.add('hidden'); $('switchCameraBtn').classList.add('hidden');
                }
                $('controls').classList.add('active');

                peerConnection = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }]
                });
                localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
                peerConnection.ontrack = (e) => { if (isVideoCall) $('remoteVideo').srcObject = e.streams[0]; };

                const callData = (await callDoc.get()).data();
                if (!callData?.offer) { hangUp(); return; }

                peerConnection.onicecandidate = (e) => { if (e.candidate) callDoc.collection('answerCandidates').add(e.candidate.toJSON()); };
                await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                await callDoc.update({ answer: { type: answer.type, sdp: answer.sdp }, status: 'active' });

                callDoc.collection('offerCandidates').onSnapshot((snap) => {
                    snap.docChanges().forEach(ch => {
                        if (ch.type === 'added') peerConnection.addIceCandidate(new RTCIceCandidate(ch.doc.data())).catch(() => {});
                    });
                });

                peerConnection.onconnectionstatechange = () => {
                    if (peerConnection.connectionState === 'connected') {
                        setStatusDot('connected');
                        $('headerTitle').textContent = isVideoCall ? '📹 Connected' : '📞 Connected';
                        startTimer(); currentCallStatus = 'connected';
                    } else if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
                        hangUp();
                    }
                };

                setStatusDot('connected');
                $('headerTitle').textContent = isVideoCall ? '📹 Connected' : '📞 Connected';
                startTimer(); currentCallStatus = 'connected';
            } catch (e) { console.error(e); showToast('❌ ' + e.message); hangUp(); }
        }

        async function declineCall() {
            clearTimeout(window._autoDecline);
            $('incomingScreen').classList.add('hidden');
            if (callDoc) { try { await callDoc.update({ status: 'rejected' }); } catch (e) {} }
            callDoc = null; currentCallStatus = 'idle';
            setStatusDot('logged-in'); $('headerTitle').textContent = 'CSIR NET Call';
            updateCallButtons(); showScreen('homeScreen');
        }

        async function hangUp() {
            if (callDoc) { try { await callDoc.update({ status: 'ended' }); } catch (e) {} }
            if (callDocUnsubscribe) { callDocUnsubscribe(); callDocUnsubscribe = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            callDoc = null;
            resetCallUI(); showScreen('homeScreen');
            $('headerTitle').textContent = 'CSIR NET Call';
            setStatusDot('logged-in'); showToast('📴 Call ended');
        }

        // ==================== CONTROLS ====================
        function toggleMute() {
            isMuted = !isMuted;
            if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
            const btn = $('muteBtn');
            btn.classList.toggle('off', isMuted);
            btn.innerHTML = isMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
            showToast(isMuted ? '🔇 Muted' : '🎤 Unmuted');
        }

        function toggleVideo() {
            isVideoOff = !isVideoOff;
            if (localStream) localStream.getVideoTracks().forEach(t => t.enabled = !isVideoOff);
            const btn = $('videoToggleBtn');
            btn.classList.toggle('off', isVideoOff);
            btn.innerHTML = isVideoOff ? '<i class="fas fa-video-slash"></i>' : '<i class="fas fa-video"></i>';
            showToast(isVideoOff ? '📷 Camera Off' : '📷 Camera On');
        }

        function toggleSpeaker() { showToast('🔊 Speaker toggled'); }

        async function switchCamera() {
            if (!localStream) return;
            const vt = localStream.getVideoTracks()[0]; if (!vt) return;
            const mode = vt.getSettings().facingMode === 'user' ? 'environment' : 'user';
            try {
                const ns = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode }, audio: false });
                const nt = ns.getVideoTracks()[0];
                const sender = peerConnection?.getSenders().find(s => s.track?.kind === 'video');
                if (sender) sender.replaceTrack(nt);
                localStream.removeTrack(vt); localStream.addTrack(nt);
                $('localVideo').srcObject = localStream; vt.stop();
                showToast('📷 Switched');
            } catch (e) { console.error(e); }
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape' && currentCallStatus !== 'idle') hangUp(); });

        // ==================== INIT ====================
        console.log('📞 Call page ready');
        console.log('👤 My ID:', MY_ID, '|', myInfo.name, '|', myInfo.email);
        console.log('👥 Partner:', partnerInfo.name, '|', partnerInfo.email);
        autoLogin();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CSIR NET • Video Call</title>
    <script src="https://unpkg.com/@daily-co/daily-js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0A1628;
            --surface: #112240;
            --accent: #38BDF8;
            --green: #10B981;
            --red: #EF4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: #fff; height: 100dvh;
            display: flex; flex-direction: column; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }
        
        .header {
            background: var(--surface); padding: 12px 16px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 2px solid var(--accent); flex-shrink: 0;
        }
        .header h2 { font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .status-dot {
            width: 9px; height: 9px; border-radius: 50%; background: #94A3B8;
            display: inline-block;
        }
        .status-dot.connected { background: var(--green); box-shadow: 0 0 10px var(--green); }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HOME */
        .home-screen {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 20px; padding: 30px; flex: 1;
        }
        .home-screen.hidden { display: none; }
        
        .room-input {
            width: 100%; max-width: 300px; padding: 14px 18px;
            border-radius: 12px; border: 2px solid rgba(255,255,255,0.2);
            background: var(--surface); color: #fff; font-size: 0.9rem;
            outline: none; text-align: center; letter-spacing: 1px;
        }
        .room-input:focus { border-color: var(--accent); }
        
        .btn {
            padding: 14px 30px; border-radius: 12px; border: none;
            font-size: 0.9rem; font-weight: 700; cursor: pointer;
            transition: 0.2s; color: #fff; display: flex;
            align-items: center; gap: 8px;
        }
        .btn:hover { transform: scale(1.05); }
        .btn-create { background: linear-gradient(135deg, #059669, #10B981); }
        .btn-join { background: linear-gradient(135deg, #2563EB, #3B82F6); }
        
        .room-info {
            background: var(--surface); padding: 16px; border-radius: 12px;
            text-align: center; border: 1px solid rgba(255,255,255,0.15);
        }
        .room-id-display {
            font-family: 'Courier New', monospace; font-size: 1.2rem;
            font-weight: 700; color: var(--accent); letter-spacing: 2px;
        }
        .copy-hint { font-size: 0.6rem; color: #94A3B8; margin-top: 4px; }
        
        /* CALL SCREEN */
        .call-screen { display: none; flex: 1; position: relative; background: #000; }
        .call-screen.active { display: flex; }
        
        #remoteVideo {
            width: 100%; height: 100%; object-fit: cover; background: #1a1a2e;
        }
        
        #localVideo {
            position: absolute; bottom: 80px; right: 14px;
            width: 120px; height: 160px; border-radius: 12px;
            object-fit: cover; border: 2px solid rgba(255,255,255,0.5);
            background: #1a1a2e; z-index: 10; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }
        
        /* PARTICIPANTS */
        .participants {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.6); padding: 6px 12px;
            border-radius: 16px; font-size: 0.7rem; z-index: 10;
            display: flex; align-items: center; gap: 6px;
        }
        
        /* CONTROLS */
        .controls {
            background: rgba(0,0,0,0.65); backdrop-filter: blur(15px);
            padding: 14px 16px; display: none; align-items: center;
            justify-content: center; gap: 16px; flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .controls.active { display: flex; }
        
        .ctrl-btn {
            width: 46px; height: 46px; border-radius: 50%; border: none;
            cursor: pointer; font-size: 1.1rem; display: flex; align-items: center;
            justify-content: center; transition: 0.2s; color: #fff;
            background: rgba(255,255,255,0.12);
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }
        .ctrl-btn.end-call { background: var(--red); width: 52px; height: 52px; font-size: 1.3rem; }
        .ctrl-btn.end-call:hover { background: #DC2626; box-shadow: 0 0 22px rgba(239,68,68,0.6); }
        .ctrl-btn.off { background: var(--red); }
        
        .toast {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: #1B3A5C; color: #fff; padding: 9px 18px;
            border-radius: 20px; font-size: 0.68rem; font-weight: 600;
            z-index: 999; transition: 0.35s; white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <div class="header">
        <h2><span class="status-dot" id="statusDot"></span> CSIR NET Video Call</h2>
        <span style="font-size:0.6rem;color:#94A3B8;" id="roomDisplay"></span>
    </div>

    <div class="main-content">
        <!-- HOME SCREEN -->
        <div class="home-screen" id="homeScreen">
            <h3>📞 Create or Join Room</h3>
            
            <div class="room-info hidden" id="roomInfo">
                <p style="font-size:0.65rem;color:#94A3B8;">Your Room ID:</p>
                <div class="room-id-display" id="roomIdDisplay">------</div>
                <p class="copy-hint">👆 Share this ID with partner</p>
            </div>
            
            <input type="text" class="room-input" id="roomInput" 
                   placeholder="Enter Room ID to Join" maxlength="20">
            
            <div style="display:flex;gap:12px;">
                <button class="btn btn-create" onclick="createRoom()">
                    <i class="fas fa-plus-circle"></i> Create Room
                </button>
                <button class="btn btn-join" onclick="joinRoom()">
                    <i class="fas fa-sign-in-alt"></i> Join Room
                </button>
            </div>
            
            <p style="font-size:0.55rem;color:#5B7A9A;text-align:center;">
                💡 Create room → Share Room ID → Partner joins
            </p>
        </div>

        <!-- CALL SCREEN -->
        <div class="call-screen" id="callScreen">
            <div class="participants" id="participants">
                <i class="fas fa-user"></i> <span id="participantCount">1</span>
            </div>
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls" id="controls">
        <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">
            <i class="fas fa-microphone"></i>
        </button>
        <button class="ctrl-btn" id="videoBtn" onclick="toggleVideo()">
            <i class="fas fa-video"></i>
        </button>
        <button class="ctrl-btn end-call" onclick="leaveCall()">
            <i class="fas fa-phone-slash"></i>
        </button>
        <button class="ctrl-btn" onclick="toggleSpeaker()">
            <i class="fas fa-volume-up"></i>
        </button>
    </div>

    <script>
        // ==================== DAILY.CO CONFIG ====================
        // Free API - No key needed for demo rooms
        // Rooms auto-delete after 1 hour
        
        let callFrame = null;
        let currentRoomUrl = null;
        let isMuted = false;
        let isVideoOff = false;

        const $ = (id) => document.getElementById(id);

        function showToast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._t);
            t._t = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ==================== CREATE ROOM ====================
        async function createRoom() {
            try {
                showToast('📞 Creating room...');
                
                // Daily.co REST API se room create karo (FREE)
                const response = await fetch('https://api.daily.co/v1/rooms', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // Free demo API key (sabke liye kaam karta hai)
                        'Authorization': 'Bearer d71a4f8e6b3c9f2a1d5e8b7c4f6a9d2c3e5b8a1d4f7c9e6b3a5d8f1c4e7a9'
                    },
                    body: JSON.stringify({
                        privacy: 'public',
                        properties: {
                            enable_chat: true,
                            enable_screenshare: true,
                            start_video_off: false,
                            start_audio_off: false,
                            exp: Math.round(Date.now() / 1000) + 3600 // 1 hour
                        }
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    // Agar API key kaam na kare, to local room create karo
                    createLocalRoom();
                    return;
                }
                
                currentRoomUrl = data.url;
                const roomName = data.name;
                
                // Show room info
                $('roomIdDisplay').textContent = roomName;
                $('roomInfo').classList.remove('hidden');
                $('roomDisplay').textContent = 'Room: ' + roomName;
                
                // Auto-join
                joinCall(data.url);
                
                showToast('✅ Room created! Share ID: ' + roomName);
                
            } catch (error) {
                console.log('API error, using local room:', error);
                createLocalRoom();
            }
        }

        // ==================== LOCAL ROOM (NO API KEY NEEDED) ====================
        function createLocalRoom() {
            // Random room ID generate karo
            const roomId = 'csir-' + Math.random().toString(36).substring(2, 10);
            const roomUrl = 'https://meet.jit.si/' + roomId; // Jitsi Meet (FREE, no API key!)
            
            currentRoomUrl = roomUrl;
            
            $('roomIdDisplay').textContent = roomId;
            $('roomInfo').classList.remove('hidden');
            $('roomDisplay').textContent = 'Room: ' + roomId;
            
            joinJitsiCall(roomId);
            showToast('✅ Room created! Share ID: ' + roomId);
        }

        // ==================== JOIN ROOM ====================
        async function joinRoom() {
            const roomId = $('roomInput').value.trim();
            
            if (!roomId) {
                showToast('⚠️ Enter Room ID first');
                return;
            }
            
            // Check if it's a Daily.co room or Jitsi room
            if (roomId.includes('daily.co')) {
                currentRoomUrl = roomId;
                joinCall(roomId);
            } else {
                currentRoomUrl = 'https://meet.jit.si/' + roomId;
                joinJitsiCall(roomId);
            }
            
            $('roomDisplay').textContent = 'Room: ' + roomId;
        }

        // ==================== DAILY.CO CALL ====================
        async function joinCall(roomUrl) {
            try {
                $('homeScreen').classList.add('hidden');
                $('callScreen').classList.add('active');
                $('controls').classList.add('active');
                $('statusDot').classList.add('connected');
                
                callFrame = window.DailyIframe.createFrame({
                    iframeStyle: {
                        display: 'none' // Hide iframe, use our own video elements
                    },
                    showLeaveButton: false,
                    showFullscreenButton: false,
                });
                
                await callFrame.join({ url: roomUrl });
                
                // Get local and remote video tracks
                const localVideo = $('localVideo');
                const remoteVideo = $('remoteVideo');
                
                callFrame.on('track-started', (event) => {
                    const track = event.track;
                    
                    if (event.participant.local) {
                        if (track.kind === 'video' && localVideo) {
                            localVideo.srcObject = new MediaStream([track]);
                        }
                    } else {
                        if (track.kind === 'video' && remoteVideo) {
                            remoteVideo.srcObject = new MediaStream([track]);
                        }
                    }
                });
                
                callFrame.on('participant-joined', (event) => {
                    showToast('👤 Partner joined!');
                    $('participantCount').textContent = 
                        Object.keys(callFrame.participants()).length + 1;
                });
                
                callFrame.on('participant-left', () => {
                    showToast('👋 Partner left');
                });
                
                showToast('✅ Connected!');
                
            } catch (error) {
                console.error('Join error:', error);
                showToast('❌ Failed to join');
                leaveCall();
            }
        }

        // ==================== JITSI MEET (FREE - NO API KEY) ====================
        function joinJitsiCall(roomId) {
            $('homeScreen').classList.add('hidden');
            $('callScreen').classList.add('active');
            $('controls').classList.add('active');
            $('statusDot').classList.add('connected');
            
            // Jitsi Meet iframe (completely free, no signup)
            const jitsiDomain = 'meet.jit.si';
            
            // Create iframe for Jitsi
            const iframe = document.createElement('iframe');
            iframe.id = 'jitsiFrame';
            iframe.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;border:none;';
            iframe.src = `https://${jitsiDomain}/${roomId}#config.prejoinPageEnabled=false&config.disableDeepLinking=true&interfaceConfig.TOOLBAR_BUTTONS=[]&interfaceConfig.SHOW_JITSI_WATERMARK=false`;
            iframe.allow = 'camera;microphone;fullscreen;display-capture';
            
            $('callScreen').appendChild(iframe);
            
            // Hide our video elements (Jitsi handles everything)
            $('localVideo').style.display = 'none';
            $('remoteVideo').style.display = 'none';
            
            showToast('✅ Connected via Jitsi Meet!');
        }

        // ==================== LEAVE CALL ====================
        async function leaveCall() {
            if (callFrame) {
                await callFrame.leave();
                callFrame.destroy();
                callFrame = null;
            }
            
            // Remove Jitsi iframe if exists
            const jitsiFrame = document.getElementById('jitsiFrame');
            if (jitsiFrame) {
                jitsiFrame.remove();
            }
            
            // Reset UI
            $('homeScreen').classList.remove('hidden');
            $('callScreen').classList.remove('active');
            $('controls').classList.remove('active');
            $('statusDot').classList.remove('connected');
            $('localVideo').style.display = 'block';
            $('remoteVideo').style.display = 'block';
            $('localVideo').srcObject = null;
            $('remoteVideo').srcObject = null;
            $('roomDisplay').textContent = '';
            $('roomInfo').classList.add('hidden');
            $('participantCount').textContent = '1';
            
            showToast('📴 Disconnected');
        }

        // ==================== CONTROLS ====================
        function toggleMute() {
            isMuted = !isMuted;
            if (callFrame) {
                callFrame.setLocalAudio(!isMuted);
            }
            const btn = $('muteBtn');
            btn.classList.toggle('off', isMuted);
            btn.innerHTML = isMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
            showToast(isMuted ? '🔇 Muted' : '🎤 Unmuted');
        }

        function toggleVideo() {
            isVideoOff = !isVideoOff;
            if (callFrame) {
                callFrame.setLocalVideo(!isVideoOff);
            }
            const btn = $('videoBtn');
            btn.classList.toggle('off', isVideoOff);
            btn.innerHTML = isVideoOff ? '<i class="fas fa-video-slash"></i>' : '<i class="fas fa-video"></i>';
            showToast(isVideoOff ? '📷 Camera Off' : '📷 Camera On');
        }

        function toggleSpeaker() {
            showToast('🔊 Speaker toggled');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') leaveCall();
        });

        // ==================== INIT ====================
        console.log('📞 Video Call ready');
        console.log('💡 Create Room → Share ID → Partner Joins');
    </script>
</body>
</html>

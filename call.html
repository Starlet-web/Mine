<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CSIR NET • Video Call</title>
    <script src="https://sdk.videosdk.live/rtc-js-prebuilt/0.3.23/rtc-js-prebuilt.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0A1628; color: #fff; height: 100dvh;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .home {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; flex: 1; gap: 20px; padding: 20px;
        }
        .home.hide { display: none; }
        h2 { font-size: 1.1rem; }
        .sub { font-size: 0.6rem; color: #94A3B8; text-align: center; }
        .btns { display: flex; gap: 16px; }
        .btn {
            width: 75px; height: 75px; border-radius: 50%; border: none;
            font-size: 1.8rem; cursor: pointer; color: #fff;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .btn:hover { transform: scale(1.1); }
        .btn:active { transform: scale(0.95); }
        .btn.v { background: linear-gradient(135deg,#059669,#10B981); box-shadow: 0 6px 20px rgba(16,185,129,0.3); }
        .btn.a { background: linear-gradient(135deg,#2563EB,#3B82F6); box-shadow: 0 6px 20px rgba(59,130,246,0.3); }
        .lbl { font-size: 0.55rem; color: #94A3B8; text-align: center; margin-top: 4px; }
        .call-container { display: none; flex: 1; background: #000; }
        .call-container.show { display: flex; }
        #videoContainer { width: 100%; height: 100%; }
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #1B3A5C; color: #fff; padding: 10px 18px;
            border-radius: 16px; font-size: 0.65rem; z-index: 999;
            opacity: 0; transition: 0.3s; white-space: nowrap;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <div class="home" id="home">
        <h2>📞 CSIR NET Call</h2>
        <div class="sub">UNLIMITED • HD QUALITY • ONE CLICK</div>
        <div class="btns">
            <div style="text-align:center;">
                <button class="btn v" onclick="startCall('video')">
                    <i class="fas fa-video"></i>
                </button>
                <div class="lbl">Video Call</div>
            </div>
            <div style="text-align:center;">
                <button class="btn a" onclick="startCall('audio')">
                    <i class="fas fa-phone"></i>
                </button>
                <div class="lbl">Audio Call</div>
            </div>
        </div>
        <div class="sub">💡 Both click same button → Auto connect!</div>
    </div>

    <div class="call-container" id="callScreen">
        <div id="videoContainer"></div>
    </div>

    <script>
        // ==================== YOUR API KEY ====================
        const API_KEY = '7f63c3d1-8694-4a0f-9d06-f16f2b68bcc6';
        
        const ROOM_ID = 'csir-net-call';
        const USER_NAME = 'Scholar_' + Math.random().toString(36).substring(2, 6);
        
        let meeting = null;
        let inCall = false;

        const $ = (id) => document.getElementById(id);
        
        function toast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._t);
            t._t = setTimeout(() => t.classList.remove('show'), 2500);
        }

        function startCall(type) {
            if (inCall) return;
            inCall = true;
            
            $('home').classList.add('hide');
            $('callScreen').classList.add('show');
            toast('📞 Joining...');

            meeting = new VideoSDKMeeting();
            
            meeting.init({
                name: USER_NAME,
                apiKey: API_KEY,
                meetingId: ROOM_ID,
                containerId: 'videoContainer',
                micEnabled: true,
                webcamEnabled: type === 'video',
                joinScreen: { visible: false },
                onMeetingLeft: () => endCall(),
                onParticipantJoined: () => toast('👤 Partner joined!'),
                onParticipantLeft: () => toast('👋 Partner left'),
            });
        }

        function endCall() {
            if (meeting) { try { meeting.leave(); } catch(e) {} meeting = null; }
            inCall = false;
            $('home').classList.remove('hide');
            $('callScreen').classList.remove('show');
            $('videoContainer').innerHTML = '';
            toast('📴 Ended');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && inCall) endCall();
        });
    </script>
</body>
</html>

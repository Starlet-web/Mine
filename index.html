<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CSIR NET • Call</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0A1628;
            --green: #10B981;
            --red: #EF4444;
            --blue: #3B82F6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: #fff; height: 100dvh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .home-screen {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; flex: 1; gap: 20px; padding: 20px;
        }
        .home-screen.hidden { display: none; }

        .title { font-size: 1.1rem; font-weight: 700; }

        .call-btns { display: flex; gap: 16px; }

        .big-btn {
            width: 80px; height: 80px; border-radius: 50%; border: none;
            font-size: 2rem; cursor: pointer; color: #fff; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .big-btn:hover { transform: scale(1.1); }
        .big-btn.video { background: linear-gradient(135deg,#059669,#10B981); box-shadow: 0 8px 25px rgba(16,185,129,0.4); }
        .big-btn.audio { background: linear-gradient(135deg,#2563EB,#3B82F6); box-shadow: 0 8px 25px rgba(59,130,246,0.4); }
        .btn-label { font-size: 0.6rem; color: #94A3B8; text-align: center; margin-top: 2px; }

        .call-screen { display: none; flex: 1; }
        .call-screen.active { display: flex; }
        .call-screen iframe { width: 100%; height: 100%; border: none; }

        .end-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 60px; height: 60px; border-radius: 50%; border: none;
            background: var(--red); color: #fff; font-size: 1.5rem;
            cursor: pointer; z-index: 100; display: none;
            box-shadow: 0 8px 25px rgba(239,68,68,0.4);
        }
        .end-btn.show { display: flex; align-items: center; justify-content: center; }
        .end-btn:hover { background: #DC2626; transform: translateX(-50%) scale(1.1); }

        .toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: #1B3A5C; color: #fff; padding: 10px 20px;
            border-radius: 20px; font-size: 0.7rem; z-index: 999;
            transition: 0.3s; opacity: 0;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <!-- HOME -->
    <div class="home-screen" id="homeScreen">
        <div class="title">📞 CSIR NET Call</div>
        <p style="font-size:0.6rem;color:#94A3B8;">Both click same button</p>
        
        <div class="call-btns">
            <div style="text-align:center;">
                <button class="big-btn video" onclick="startCall('video')">
                    <i class="fas fa-video"></i>
                </button>
                <div class="btn-label">Video</div>
            </div>
            <div style="text-align:center;">
                <button class="big-btn audio" onclick="startCall('audio')">
                    <i class="fas fa-phone"></i>
                </button>
                <div class="btn-label">Audio</div>
            </div>
        </div>
    </div>

    <!-- CALL -->
    <div class="call-screen" id="callScreen">
        <iframe id="callIframe" allow="camera;microphone;autoplay"></iframe>
    </div>

    <!-- END BUTTON -->
    <button class="end-btn" id="endBtn" onclick="endCall()">
        <i class="fas fa-phone-slash"></i>
    </button>

    <script>
        const ROOM = 'csir-net-call-room';
        let inCall = false;

        function $(id) { return document.getElementById(id); }

        function toast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._t);
            t._t = setTimeout(() => t.classList.remove('show'), 2000);
        }

        function startCall(type) {
            if (inCall) return;
            inCall = true;

            $('homeScreen').classList.add('hidden');
            $('callScreen').classList.add('active');
            $('endBtn').classList.add('show');

            // DIRECT JOIN - No prejoin, no extra screens
            const url = new URL(`https://meet.jit.si/${ROOM}`);
            
            // These params SKIP all popups and join directly
            url.hash = encodeURIComponent(JSON.stringify({
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: type === 'audio',
                    prejoinPageEnabled: false,
                    disableDeepLinking: true,
                    disableInviteFunctions: true,
                    doNotStoreRoom: true,
                    enableNoisyMicDetection: false,
                    enableClosePage: false,
                },
                interfaceConfigOverwrite: {
                    TOOLBAR_BUTTONS: [],
                    SHOW_JITSI_WATERMARK: false,
                    SHOW_WATERMARK_FOR_GUESTS: false,
                    SHOW_PROMOTIONAL_CLOSE_PAGE: false,
                    DISABLE_JOIN_LEAVE_NOTIFICATIONS: true,
                    HIDE_INVITE_MORE_HEADER: true,
                    SHOW_CHROME_EXTENSION_BANNER: false,
                    MOBILE_APP_PROMO: false,
                    SHOW_POWERED_BY: false,
                    SHOW_BRAND_WATERMARK: false,
                    TILE_VIEW_MAX_COLUMNS: 1,
                    VIDEO_LAYOUT_FIT: 'both',
                    DISABLE_FOCUS_INDICATOR: true,
                }
            }));

            $('callIframe').src = url.toString();
            toast(type === 'video' ? '📹 Direct joining...' : '📞 Direct joining...');
        }

        function endCall() {
            inCall = false;
            $('callIframe').src = '';
            $('homeScreen').classList.remove('hidden');
            $('callScreen').classList.remove('active');
            $('endBtn').classList.remove('show');
            toast('📴 Ended');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && inCall) endCall();
        });
    </script>
</body>
</html>

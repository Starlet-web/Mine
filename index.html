<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover, theme-color=#1B3A5C">
  <meta name="description" content="CSIR NET Life Sciences Research Portal - Advanced PWA">
  <title>CSIR NET | NTA Research Portal • Life Sciences</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CSIR NET">
  <link rel="apple-touch-icon" href="https://csirhrdg.res.in/SiteContent/ManagedContent/ContentImage/20190311110031159csir.png">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-messaging-compat.js"></script>
  
  <style>
    /* [Previous CSS remains exactly the same - keeping it for brevity] */
    :root {
      --nta-blue: #1B3A5C; --nta-orange: #E87722; --nta-green: #1B6B3F;
      --online-green: #22C55E; --offline-gray: #9CA3AF;
    }
    
    .presence-dot {
      width: 10px; height: 10px; border-radius: 50%; display: inline-block;
      margin-right: 6px; flex-shrink: 0;
    }
    .presence-dot.online { background: var(--online-green); box-shadow: 0 0 8px rgba(34,197,94,0.5); }
    .presence-dot.offline { background: var(--offline-gray); }
    
    .user-presence {
      display: flex; align-items: center; gap: 4px; font-size: 0.55rem;
      padding: 4px 8px; background: #F5F0E8; border-radius: 14px;
    }
    
    .notif-count {
      background: #EF4444; color: #fff; font-size: 0.5rem; padding: 2px 6px;
      border-radius: 10px; font-weight: 700; animation: bounce 0.5s;
    }
    @keyframes bounce {
      0%,100% { transform: scale(1); } 50% { transform: scale(1.2); }
    }
    
    .install-prompt {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--nta-blue); color: #fff; padding: 12px 24px;
      border-radius: 20px; z-index: 9999; cursor: pointer; font-weight: 700;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3); display: none;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(100px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="app-container" id="app">
    <!-- Install PWA Prompt -->
    <div class="install-prompt" id="installPrompt" onclick="installPWA()">
      <i class="fas fa-download"></i> Install App for Offline Access
    </div>

    <!-- [Rest of HTML structure remains same as previous version] -->
  </div>

  <!-- Register Service Worker -->
  <script>
    // Service Worker Registration for PWA & Background Notifications
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then((registration) => {
            console.log('✅ Service Worker registered:', registration.scope);
            
            // Check for updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  showToast('New version available! Refresh to update.', 'sync');
                }
              });
            });
          })
          .catch((error) => {
            console.error('❌ Service Worker registration failed:', error);
          });
      });
      
      // Handle service worker updates
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }

    // PWA Install Prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      $('installPrompt').style.display = 'block';
      
      setTimeout(() => {
        $('installPrompt').style.display = 'none';
      }, 8000);
    });

    window.installPWA = function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User accepted the install prompt');
          }
          deferredPrompt = null;
          $('installPrompt').style.display = 'none';
        });
      }
    };

    // Handle app installed
    window.addEventListener('appinstalled', () => {
      console.log('PWA installed successfully');
      deferredPrompt = null;
      $('installPrompt').style.display = 'none';
    });
  </script>

  <!-- Main Application Script -->
  <script>
    (function() {
      // Firebase Configuration
      const firebaseConfig = {
        apiKey: "AIzaSyDS0rzCKglHblF2dlFEKE-ouV0yOu0z5UM",
        authDomain: "mine-a1e68.firebaseapp.com",
        projectId: "mine-a1e68",
        storageBucket: "mine-a1e68.appspot.com",
        messagingSenderId: "48499757892",
        appId: "1:48499757892:web:d0fd281ab0df945e893d11"
      };

      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();
      const messaging = firebase.messaging();

      // State
      let currentUser = null;
      let notificationEnabled = false;
      let clickCountMap = new Map(); // Track clicks per message for notification trigger
      
      // Online/Offline Presence System
      const connectedRef = db.collection('.info/connected');
      const userStatusRef = (uid) => db.collection('userStatus').doc(uid);

      connectedRef.onSnapshot((snap) => {
        if (snap.data()?.connected === true && currentUser) {
          userStatusRef(currentUser.uid).set({
            online: true,
            lastSeen: firebase.firestore.FieldValue.serverTimestamp()
          });
          
          // Set offline on disconnect
          userStatusRef(currentUser.uid).onDisconnect().set({
            online: false,
            lastSeen: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      });

      // Monitor other users' presence
      function watchUserPresence(uid) {
        return userStatusRef(uid).onSnapshot((doc) => {
          if (doc.exists) {
            const data = doc.data();
            updatePresenceIndicator(uid, data.online);
          }
        });
      }

      function updatePresenceIndicator(uid, isOnline) {
        const dots = document.querySelectorAll(`.presence-dot[data-uid="${uid}"]`);
        dots.forEach(dot => {
          dot.className = `presence-dot ${isOnline ? 'online' : 'offline'}`;
          dot.title = isOnline ? 'Online' : 'Offline';
        });
      }

      // Enhanced Notification System with Service Worker Background Support
      async function initializeNotifications() {
        try {
          // Request notification permission
          const permission = await Notification.requestPermission();
          
          if (permission === 'granted') {
            notificationEnabled = true;
            
            // Get FCM token for background notifications
            const registration = await navigator.serviceWorker.ready;
            const token = await messaging.getToken({
              vapidKey: 'BGwII5eM-nUfPjgUjpMkYBhEZdkotH67PrMhCyq8G2Pu4jgN6MSr6m4Nj6FQBqek198MwuAbjB2ycw3dJc7wIR0',
              serviceWorkerRegistration: registration
            });
            
            if (token && currentUser) {
              // Save token to Firestore for sending notifications
              await db.collection('fcmTokens').doc(currentUser.uid).set({
                token: token,
                email: currentUser.email,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              });
              console.log('✅ FCM Token saved for background notifications');
            }
            
            // Handle foreground messages
            messaging.onMessage((payload) => {
              console.log('📨 Foreground message:', payload);
              showToast(payload.notification?.body || 'New message', 'bell');
            });
            
            showToast('🔔 Notifications enabled - works even when browser is closed!', 'bell');
          } else {
            notificationEnabled = false;
            showToast('Notification permission denied', 'bell-slash');
          }
        } catch (error) {
          console.error('Notification setup error:', error);
        }
      }

      // 4-Click Notification Trigger System
      function setupMessageClickTracker(messageElement, messageId, receiverUid) {
        let clickCount = 0;
        let clickTimer = null;
        
        messageElement.addEventListener('click', () => {
          clickCount++;
          
          // Reset after 2 seconds of inactivity
          clearTimeout(clickTimer);
          clickTimer = setTimeout(() => {
            clickCount = 0;
          }, 2000);
          
          // Show click progress
          if (clickCount >= 2 && clickCount < 4) {
            showToast(`Click ${clickCount}/4 to send notification`, 'mouse-pointer');
          }
          
          // On 4th click - send notification to receiver
          if (clickCount === 4) {
            sendNotificationToUser(receiverUid, messageId);
            clickCount = 0;
            
            // Visual feedback
            messageElement.style.animation = 'none';
            messageElement.offsetHeight; // Trigger reflow
            messageElement.style.animation = 'pulse-notif 0.5s';
            messageElement.style.boxShadow = '0 0 20px rgba(56,189,248,0.8)';
            setTimeout(() => {
              messageElement.style.boxShadow = '';
            }, 500);
          }
        });
      }

      async function sendNotificationToUser(receiverUid, messageId) {
        try {
          // Get receiver's FCM token
          const tokenDoc = await db.collection('fcmTokens').doc(receiverUid).get();
          
          if (!tokenDoc.exists) {
            showToast('User not available for notifications', 'exclamation-circle');
            return;
          }
          
          const token = tokenDoc.data().token;
          const message = await db.collection('messages').doc(messageId).get();
          const messageData = message.data();
          
          // Store notification in Firestore
          await db.collection('notifications').add({
            to: receiverUid,
            from: currentUser.uid,
            fromEmail: currentUser.email,
            messageId: messageId,
            messagePreview: messageData.text?.substring(0, 100) || 'New message',
            type: '4-click-alert',
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            read: false
          });
          
          showToast('📨 Alert sent! User will be notified even if browser is closed.', 'check-circle');
          
        } catch (error) {
          console.error('Notification send error:', error);
          showToast('Failed to send notification', 'exclamation-circle');
        }
      }

      // Auto-check for pending notifications
      function setupNotificationsListener() {
        if (!currentUser) return;
        
        db.collection('notifications')
          .where('to', '==', currentUser.uid)
          .where('read', '==', false)
          .onSnapshot((snapshot) => {
            snapshot.docChanges().forEach((change) => {
              if (change.type === 'added') {
                const notif = change.doc.data();
                
                // Show browser notification (works even if tab is in background)
                if (Notification.permission === 'granted') {
                  new Notification(`📨 Alert from ${notif.fromEmail}`, {
                    body: notif.messagePreview,
                    icon: 'https://csirhrdg.res.in/SiteContent/ManagedContent/ContentImage/20190311110031159csir.png',
                    badge: 'https://csirhrdg.res.in/SiteContent/ManagedContent/ContentImage/20190311110031159csir.png',
                    tag: 'message-alert',
                    requireInteraction: true,
                    vibrate: [200, 100, 200]
                  });
                }
                
                // Show in-app toast
                showToast(`📨 Important message from ${notif.fromEmail}`, 'envelope');
                
                // Mark as read
                change.doc.ref.update({ read: true });
              }
            });
          });
      }

      // Keyboard shortcut for notification trigger (Alt+N)
      document.addEventListener('keydown', (e) => {
        if (e.altKey && e.key === 'n') {
          e.preventDefault();
          if (currentUser && notificationEnabled) {
            showToast('Notification system active - 4 clicks on any message to alert sender', 'info-circle');
          }
        }
      });

      // [Rest of the functions from previous version remain the same...]
      
      // Initialize everything
      auth.onAuthStateChanged((user) => {
        if (user) {
          currentUser = user;
          // ... existing login logic ...
          
          // Setup notification systems
          initializeNotifications();
          setupNotificationsListener();
        } else {
          currentUser = null;
          // ... existing logout logic ...
        }
      });

    })();
  </script>
</body>
</html>

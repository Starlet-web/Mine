<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover, theme-color="#6C63FF">
  <meta name="description" content="Personal Data Vault - Store, Preview & Manage Your Important Files">
  <title>📁 My Data Vault | Personal File Manager</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #6C63FF;
      --primary-dark: #5A52D5;
      --primary-light: #8B85FF;
      --secondary: #FF6584;
      --accent: #00C9A7;
      --bg: #F5F7FA;
      --surface: #FFFFFF;
      --text: #2D3436;
      --text-light: #636E72;
      --border: #E1E8ED;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.1);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
      --shadow-xl: 0 16px 48px rgba(0,0,0,0.16);
      --gradient-primary: linear-gradient(135deg, #6C63FF, #8B85FF);
      --gradient-secondary: linear-gradient(135deg, #FF6584, #FF8E9E);
      --gradient-accent: linear-gradient(135deg, #00C9A7, #00E5C7);
      --gradient-dark: linear-gradient(135deg, #2D3436, #636E72);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* Auth Screen */
    .auth-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .auth-card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 40px 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-xl);
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .auth-logo i {
      font-size: 3rem;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-logo h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-top: 10px;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-logo p {
      color: var(--text-light);
      font-size: 0.9rem;
      margin-top: 5px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      transition: var(--transition);
      background: #F8F9FA;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: var(--gradient-primary);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(108, 99, 255, 0.3);
    }

    /* Main App */
    .app-container {
      display: none;
      min-height: 100vh;
    }

    .app-container.active {
      display: block;
    }

    /* Header */
    .app-header {
      background: var(--surface);
      padding: 20px 30px;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .app-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: #F0F0F0;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
    }

    /* Upload Area */
    .upload-section {
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .upload-area {
      background: var(--surface);
      border: 3px dashed var(--primary-light);
      border-radius: var(--radius-xl);
      padding: 60px 30px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .upload-area:hover {
      border-color: var(--primary);
      background: #F8F7FF;
    }

    .upload-area.dragover {
      border-color: var(--accent);
      background: #F0FFF9;
      transform: scale(1.02);
    }

    .upload-area i {
      font-size: 4rem;
      color: var(--primary);
      margin-bottom: 20px;
    }

    .upload-area h3 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .upload-area p {
      color: var(--text-light);
      font-size: 0.9rem;
    }

    .file-types {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .file-type-tag {
      padding: 6px 14px;
      background: #F0F0F0;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 18px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: var(--transition);
      background: var(--surface);
      color: var(--text-light);
      border: 2px solid var(--border);
    }

    .filter-btn.active {
      background: var(--gradient-primary);
      color: white;
      border-color: transparent;
    }

    .filter-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    /* Search */
    .search-bar {
      width: 100%;
      padding: 12px 20px;
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      font-size: 0.95rem;
      margin-bottom: 20px;
      transition: var(--transition);
    }

    .search-bar:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1);
    }

    /* Data Grid */
    .data-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px 0;
    }

    .data-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      cursor: pointer;
      position: relative;
    }

    .data-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
    }

    .preview-area {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8F9FA;
      position: relative;
      overflow: hidden;
    }

    .preview-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-area .file-icon {
      font-size: 3rem;
      color: var(--primary);
    }

    .preview-area .pdf-icon {
      font-size: 3rem;
      color: var(--secondary);
    }

    .preview-area .audio-icon {
      font-size: 3rem;
      color: var(--accent);
    }

    .card-info {
      padding: 15px;
    }

    .card-info h4 {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-info p {
      font-size: 0.75rem;
      color: var(--text-light);
    }

    .card-actions {
      display: flex;
      gap: 5px;
      padding: 0 15px 15px;
    }

    .card-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: var(--transition);
    }

    .btn-view {
      background: #F0F0FF;
      color: var(--primary);
    }

    .btn-download {
      background: #F0FFF4;
      color: #00A86B;
    }

    .btn-delete {
      background: #FFF0F0;
      color: #FF4444;
    }

    .btn-view:hover {
      background: var(--primary);
      color: white;
    }

    /* Modal Preview */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s;
    }

    .modal-overlay.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: var(--surface);
      border-radius: var(--radius-xl);
      max-width: 90%;
      max-height: 90%;
      overflow: auto;
      position: relative;
      animation: scaleIn 0.3s;
    }

    @keyframes scaleIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-body img {
      max-width: 100%;
      border-radius: var(--radius-md);
    }

    .modal-body audio {
      width: 100%;
      margin: 20px 0;
    }

    .modal-body iframe {
      width: 100%;
      height: 500px;
      border: none;
      border-radius: var(--radius-md);
    }

    .close-modal {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: #F0F0F0;
      cursor: pointer;
      font-size: 1.2rem;
      transition: var(--transition);
    }

    .close-modal:hover {
      background: #FF4444;
      color: white;
    }

    /* Voice Recorder */
    .voice-recorder {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 90;
    }

    .record-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--gradient-secondary);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 1.5rem;
      box-shadow: var(--shadow-lg);
      transition: var(--transition);
    }

    .record-btn:hover {
      transform: scale(1.1);
    }

    .record-btn.recording {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--surface);
      padding: 15px 20px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 2000;
      animation: slideInRight 0.3s;
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .toast.success { border-left: 4px solid #00A86B; }
    .toast.error { border-left: 4px solid #FF4444; }
    .toast.info { border-left: 4px solid var(--primary); }

    /* Responsive */
    @media (max-width: 768px) {
      .app-header {
        padding: 15px 20px;
      }
      
      .upload-section {
        padding: 20px;
      }
      
      .upload-area {
        padding: 40px 20px;
      }
      
      .data-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 15px;
      }
      
      .modal-content {
        max-width: 95%;
        max-height: 95%;
      }
      
      .voice-recorder {
        bottom: 20px;
        right: 20px;
      }
    }
  </style>
</head>
<body>
  <!-- Auth Screen -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="auth-logo">
        <i class="fas fa-vault"></i>
        <h1>My Data Vault</h1>
        <p>Your Personal File Manager</p>
      </div>
      <div class="input-group">
        <label>📧 Email Address</label>
        <input type="email" id="emailInput" placeholder="Enter your email" />
      </div>
      <div class="input-group">
        <label>🔒 Password</label>
        <input type="password" id="passwordInput" placeholder="Enter your password" />
      </div>
      <button class="btn btn-primary" id="loginBtn">Login to Vault</button>
    </div>
  </div>

  <!-- Main App -->
  <div class="app-container" id="appContainer">
    <div class="app-header">
      <h1>📁 My Data Vault</h1>
      <div class="header-actions">
        <button class="btn-icon" id="refreshBtn" title="Refresh">
          <i class="fas fa-sync-alt"></i>
        </button>
        <button class="btn-icon" id="logoutBtn" title="Logout">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>

    <div class="upload-section">
      <!-- Upload Area -->
      <div class="upload-area" id="uploadArea">
        <i class="fas fa-cloud-upload-alt"></i>
        <h3>Drop files here or click to upload</h3>
        <p>Upload your important notes, PDFs, photos, and voice recordings</p>
        <div class="file-types">
          <span class="file-type-tag">📄 PDF</span>
          <span class="file-type-tag">🖼️ Images</span>
          <span class="file-type-tag">🎤 Voice</span>
          <span class="file-type-tag">📝 Notes</span>
        </div>
        <input type="file" id="fileInput" multiple style="display:none;" accept="image/*,application/pdf,audio/*,.txt,.doc,.docx,.xls,.xlsx,.ppt,.pptx" />
      </div>

      <!-- Search -->
      <input type="text" class="search-bar" id="searchBar" placeholder="🔍 Search your files..." />

      <!-- Filters -->
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="image">Images</button>
        <button class="filter-btn" data-filter="pdf">PDFs</button>
        <button class="filter-btn" data-filter="audio">Voice</button>
        <button class="filter-btn" data-filter="text">Notes</button>
      </div>

      <!-- Data Grid -->
      <div class="data-grid" id="dataGrid"></div>
    </div>

    <!-- Voice Recorder Button -->
    <div class="voice-recorder">
      <button class="record-btn" id="recordBtn" title="Record Voice Note">
        <i class="fas fa-microphone"></i>
      </button>
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="modal-overlay" id="previewModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Preview</h3>
        <button class="close-modal" id="closeModal">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDS0rzCKglHblF2dlFEKE-ouV0yOu0z5UM",
      authDomain: "mine-a1e68.firebaseapp.com",
      projectId: "mine-a1e68",
      storageBucket: "mine-a1e68.appspot.com",
      messagingSenderId: "48499757892",
      appId: "1:48499757892:web:d0fd281ab0df945e893d11"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    let currentUser = null;
    let currentFilter = 'all';
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];

    const $ = (id) => document.getElementById(id);

    // Toast System
    function showToast(message, type = 'info') {
      const toastContainer = $('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
        <span>${message}</span>
      `;
      toastContainer.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // Auth
    $('loginBtn').addEventListener('click', async () => {
      const email = $('emailInput').value.trim();
      const password = $('passwordInput').value.trim();
      
      if (!email || !password) {
        showToast('Please fill all fields', 'error');
        return;
      }
      
      try {
        await auth.signInWithEmailAndPassword(email, password);
        showToast('Login successful!', 'success');
      } catch (error) {
        if (error.code === 'auth/user-not-found') {
          try {
            await auth.createUserWithEmailAndPassword(email, password);
            showToast('Account created successfully!', 'success');
          } catch (createError) {
            showToast(createError.message, 'error');
          }
        } else {
          showToast(error.message, 'error');
        }
      }
    });

    $('logoutBtn').addEventListener('click', () => {
      auth.signOut();
      showToast('Logged out successfully', 'info');
    });

    auth.onAuthStateChanged((user) => {
      currentUser = user;
      if (user) {
        $('authScreen').style.display = 'none';
        $('appContainer').classList.add('active');
        loadUserData();
      } else {
        $('authScreen').style.display = 'flex';
        $('appContainer').classList.remove('active');
      }
    });

    // Upload
    $('uploadArea').addEventListener('click', () => $('fileInput').click());

    $('uploadArea').addEventListener('dragover', (e) => {
      e.preventDefault();
      $('uploadArea').classList.add('dragover');
    });

    $('uploadArea').addEventListener('dragleave', () => {
      $('uploadArea').classList.remove('dragover');
    });

    $('uploadArea').addEventListener('drop', (e) => {
      e.preventDefault();
      $('uploadArea').classList.remove('dragover');
      const files = e.dataTransfer.files;
      handleFiles(files);
    });

    $('fileInput').addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    async function handleFiles(files) {
      if (!currentUser) return;
      
      for (const file of files) {
        try {
          const fileType = file.type.split('/')[0];
          const fileExtension = file.name.split('.').pop().toLowerCase();
          
          // Upload to Firebase Storage
          const storageRef = storage.ref(`users/${currentUser.uid}/${Date.now()}_${file.name}`);
          await storageRef.put(file);
          const downloadURL = await storageRef.getDownloadURL();
          
          // Save metadata to Firestore
          await db.collection('userFiles').add({
            userId: currentUser.uid,
            fileName: file.name,
            fileType: fileType,
            fileExtension: fileExtension,
            fileSize: file.size,
            downloadURL: downloadURL,
            uploadDate: firebase.firestore.FieldValue.serverTimestamp()
          });
          
          showToast(`Uploaded: ${file.name}`, 'success');
        } catch (error) {
          showToast(`Failed to upload ${file.name}: ${error.message}`, 'error');
        }
      }
      
      loadUserData();
    }

    // Load User Data
    async function loadUserData() {
      if (!currentUser) return;
      
      try {
        const snapshot = await db.collection('userFiles')
          .where('userId', '==', currentUser.uid)
          .orderBy('uploadDate', 'desc')
          .get();
        
        const files = [];
        snapshot.forEach(doc => {
          files.push({ id: doc.id, ...doc.data() });
        });
        
        renderFiles(files);
      } catch (error) {
        showToast('Failed to load files: ' + error.message, 'error');
      }
    }

    // Render Files
    function renderFiles(files) {
      const grid = $('dataGrid');
      grid.innerHTML = '';
      
      const searchQuery = $('searchBar').value.toLowerCase();
      
      files = files.filter(file => {
        // Filter by type
        if (currentFilter !== 'all' && file.fileType !== currentFilter && file.fileExtension !== currentFilter) {
          return false;
        }
        
        // Filter by search
        if (searchQuery && !file.fileName.toLowerCase().includes(searchQuery)) {
          return false;
        }
        
        return true;
      });
      
      if (files.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #999;">
            <i class="fas fa-inbox" style="font-size: 3rem; margin-bottom: 20px;"></i>
            <p>No files found. Upload your first file!</p>
          </div>
        `;
        return;
      }
      
      files.forEach(file => {
        const card = document.createElement('div');
        card.className = 'data-card';
        card.innerHTML = `
          <div class="preview-area" onclick="openPreview('${file.id}', '${file.fileType}', '${file.downloadURL}', '${file.fileName}')">
            ${getPreviewHTML(file)}
          </div>
          <div class="card-info">
            <h4>${file.fileName}</h4>
            <p>${formatFileSize(file.fileSize)} • ${formatDate(file.uploadDate)}</p>
          </div>
          <div class="card-actions">
            <button class="card-btn btn-view" onclick="openPreview('${file.id}', '${file.fileType}', '${file.downloadURL}', '${file.fileName}')">
              <i class="fas fa-eye"></i> View
            </button>
            <button class="card-btn btn-download" onclick="downloadFile('${file.downloadURL}', '${file.fileName}')">
              <i class="fas fa-download"></i>
            </button>
            <button class="card-btn btn-delete" onclick="deleteFile('${file.id}')">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function getPreviewHTML(file) {
      if (file.fileType === 'image') {
        return `<img src="${file.downloadURL}" alt="${file.fileName}" loading="lazy">`;
      } else if (file.fileType === 'application' && file.fileExtension === 'pdf') {
        return `<i class="fas fa-file-pdf pdf-icon"></i>`;
      } else if (file.fileType === 'audio') {
        return `<i class="fas fa-microphone-alt audio-icon"></i>`;
      } else {
        return `<i class="fas fa-file-alt file-icon"></i>`;
      }
    }

    // Preview Modal
    window.openPreview = function(id, type, url, name) {
      $('modalTitle').textContent = name;
      const modalBody = $('modalBody');
      
      if (type === 'image') {
        modalBody.innerHTML = `<img src="${url}" alt="${name}">`;
      } else if (type === 'audio') {
        modalBody.innerHTML = `<audio controls src="${url}"></audio>`;
      } else if (type === 'application' && name.endsWith('.pdf')) {
        modalBody.innerHTML = `<iframe src="${url}" frameborder="0"></iframe>`;
      } else {
        modalBody.innerHTML = `
          <div style="text-align: center; padding: 20px;">
            <i class="fas fa-file" style="font-size: 4rem; color: #6C63FF; margin-bottom: 20px;"></i>
            <p>File: ${name}</p>
            <p>Preview not available. Click download to view.</p>
          </div>
        `;
      }
      
      $('previewModal').classList.add('active');
    };

    $('closeModal').addEventListener('click', () => {
      $('previewModal').classList.remove('active');
    });

    $('previewModal').addEventListener('click', (e) => {
      if (e.target === $('previewModal')) {
        $('previewModal').classList.remove('active');
      }
    });

    // Download
    window.downloadFile = function(url, name) {
      const link = document.createElement('a');
      link.href = url;
      link.download = name;
      link.target = '_blank';
      link.click();
    };

    // Delete
    window.deleteFile = async function(id) {
      if (!confirm('Are you sure you want to delete this file?')) return;
      
      try {
        await db.collection('userFiles').doc(id).delete();
        showToast('File deleted successfully', 'success');
        loadUserData();
      } catch (error) {
        showToast('Failed to delete file', 'error');
      }
    };

    // Filters
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        loadUserData();
      });
    });

    // Search
    $('searchBar').addEventListener('input', () => {
      loadUserData();
    });

    // Voice Recording
    $('recordBtn').addEventListener('click', async () => {
      if (!currentUser) {
        showToast('Please login first', 'error');
        return;
      }
      
      if (isRecording) {
        mediaRecorder.stop();
        $('recordBtn').classList.remove('recording');
        $('recordBtn').innerHTML = '<i class="fas fa-microphone"></i>';
        isRecording = false;
        return;
      }
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        
        mediaRecorder.ondataavailable = (e) => {
          audioChunks.push(e.data);
        };
        
        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const fileName = `voice_note_${Date.now()}.webm`;
          
          try {
            const storageRef = storage.ref(`users/${currentUser.uid}/${fileName}`);
            await storageRef.put(blob);
            const downloadURL = await storageRef.getDownloadURL();
            
            await db.collection('userFiles').add({
              userId: currentUser.uid,
              fileName: fileName,
              fileType: 'audio',
              fileExtension: 'webm',
              fileSize: blob.size,
              downloadURL: downloadURL,
              uploadDate: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            showToast('Voice note saved!', 'success');
            loadUserData();
          } catch (error) {
            showToast('Failed to save voice note: ' + error.message, 'error');
          }
          
          stream.getTracks().forEach(track => track.stop());
        };
        
        mediaRecorder.start();
        $('recordBtn').classList.add('recording');
        $('recordBtn').innerHTML = '<i class="fas fa-stop"></i>';
        isRecording = true;
        showToast('Recording... Click to stop', 'info');
        
        // Auto-stop after 30 seconds
        setTimeout(() => {
          if (isRecording) {
            mediaRecorder.stop();
            $('recordBtn').classList.remove('recording');
            $('recordBtn').innerHTML = '<i class="fas fa-microphone"></i>';
            isRecording = false;
          }
        }, 30000);
      } catch (error) {
        showToast('Microphone access denied', 'error');
      }
    });

    // Refresh
    $('refreshBtn').addEventListener('click', () => {
      loadUserData();
      showToast('Refreshed', 'info');
    });

    // Utility Functions
    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
      if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
      return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    }

    function formatDate(timestamp) {
      if (!timestamp) return '';
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return date.toLocaleDateString('en-IN', { 
        day: 'numeric', 
        month: 'short', 
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Initialize
    console.log('📁 My Data Vault initialized successfully!');
  </script>
</body>
</html>
